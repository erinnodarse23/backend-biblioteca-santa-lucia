services:
  postgres:
    image: postgres:18-alpine
    container_name: biblioteca-postgres
    environment:
      POSTGRES_DB: biblioteca_santa_lucia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/tablas.sql:/docker-entrypoint-initdb.d/01-tablas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biblioteca_santa_lucia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblioteca-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/biblioteca_santa_lucia
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: default
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local